name: subsoil-hosted
services:
  edge:
    image: caddy:2.11-alpine
    environment:
      FILES_HOST: ${FILES_HOST:?Run deploy/configure.py first}
      REGISTRY_HOST: ${REGISTRY_HOST:?Run deploy/configure.py first}
      AUTH_HOST: ${AUTH_HOST:?Run deploy/configure.py first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?Run deploy/configure.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  keycloak:
    image: ghcr.io/zahmadsaleem/subsoil-keycloak:${SUBSOIL_IMAGE_TAG:?Set SUBSOIL_IMAGE_TAG to a published commit SHA}
    command: ["start", "--features=docker", "--import-realm"]
    environment:
      KC_HOSTNAME: https://${AUTH_HOST:?Run deploy/configure.py first}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?Run deploy/configure.py first}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Run deploy/configure.py first}
    volumes:
      - ./build/hosted/subsoil-realm.json:/opt/keycloak/data/import/subsoil-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  identity-init:
    image: python:3.14-slim
    command: ["python", "/demo/configure-identity.py"]
    environment:
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Run deploy/configure.py first}
    volumes:
      - ./demo:/demo:ro
      - ./build/hosted:/settings:ro
      - identity:/identity
    depends_on: [keycloak]
  zot-init:
    image: python:3.14-slim
    command: ["python", "/demo/prepare-zot.py"]
    environment:
      ISSUER_PUBLIC: https://${AUTH_HOST:?Run deploy/configure.py first}/realms/subsoil
      FILES_PUBLIC: https://${FILES_HOST:?Run deploy/configure.py first}
      SUBSOIL_RELEASE: ${SUBSOIL_IMAGE_TAG:?Set SUBSOIL_IMAGE_TAG to a published commit SHA}
    volumes:
      - ./demo:/demo:ro
      - zot-config:/config
      - envoy-config:/envoy
    depends_on: [keycloak]
  zot:
    image: ghcr.io/project-zot/zot:v2.1.23
    command: ["serve", "/config/zot.json"]
    volumes:
      - zot-config:/config:ro
      - zot-data:/var/lib/zot
    depends_on:
      zot-init: {condition: service_completed_successfully, restart: true}
    restart: unless-stopped
  registry:
    image: envoyproxy/envoy:v1.36.4
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - envoy-config:/etc/envoy:ro
      - zot-config:/config:ro
    depends_on:
      zot: {condition: service_started}
      zot-init: {condition: service_completed_successfully, restart: true}
    restart: unless-stopped
  subsoil:
    image: ghcr.io/zahmadsaleem/subsoil:${SUBSOIL_IMAGE_TAG:?Set SUBSOIL_IMAGE_TAG to a published commit SHA}
    environment:
      SUBSOIL_REGISTRAR_FILE: /identity/registrar.json
    volumes:
      - ./build/hosted/subsoil.json:/etc/subsoil/config.json:ro
      - identity:/identity:ro
    depends_on:
      registry: {condition: service_started}
      identity-init: {condition: service_completed_successfully}
    restart: unless-stopped
  seed:
    image: python:3.14-slim
    command: ["python", "/demo/seed.py"]
    environment:
      REGISTRY_PUBLIC: https://${REGISTRY_HOST:?Run deploy/configure.py first}
      SEED_SECRET: ${SEED_SECRET:?Run deploy/configure.py first}
    volumes:
      - ./demo:/demo:ro
    depends_on: [registry]
volumes:
  identity:
  envoy-config:
  caddy-data:
  caddy-config:
  postgres-data:
  zot-config:
  zot-data:
