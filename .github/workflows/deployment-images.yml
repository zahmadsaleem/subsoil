name: Publish Deployment Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/deployment-images.yml
      - Dockerfile
      - .dockerignore
      - "*.go"
      - go.mod
      - LICENSE
      - assets/brand/**
      - web/**
      - examples/editor/**
      - compose*.yaml
      - deploy/**
      - demo/*.py
      - demo/*.cjs
      - demo/*.yaml
      - demo/keycloak/**

permissions:
  contents: read
  packages: write

jobs:
  demo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Start the demo and check OCI clients
        run: |
          docker compose up --build -d
          docker compose --profile test run --rm smoke
      - name: Check workspace signup and browser handoffs
        run: |
          npm install --prefix "$RUNNER_TEMP/subsoil-browser" --no-save playwright@1.65.1
          node "$RUNNER_TEMP/subsoil-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python3 -m http.server 5173 --bind 127.0.0.1 --directory examples/editor > "$RUNNER_TEMP/subsoil-starter.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/subsoil-browser/node_modules" node demo/workspace-smoke.cjs
      - name: Show service status
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 50 identity-init subsoil keycloak registry zot-init zot seed

  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/zahmadsaleem/subsoil
            context: .
          - image: ghcr.io/zahmadsaleem/subsoil-keycloak
            context: ./demo/keycloak
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}
