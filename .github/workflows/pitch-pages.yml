name: Publish Subsoil website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/brand/subsoil-logo.svg
      - assets/brand/subsoil-wordmark.svg
      - assets/brand/subsoil-symbol.svg
      - docs/CDE_AI_RESEARCH.md
      - docs/PHILOSOPHY.md
      - docs/handbook.html
      - presentations/open-cde-governance/**
      - presentations/project-data-exchange/**
      - .github/workflows/pitch-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitch-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate and prepare public site
        run: python3 site/prepare_site.py --output build/subsoil-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/subsoil-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
