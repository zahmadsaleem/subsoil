---
- name: Prepare a Debian 13 host for Subsoil
  hosts: all
  become: true
  gather_facts: false
  vars:
    subsoil_deploy_user: deploy
    subsoil_deploy_public_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/id_ed25519.pub"
    subsoil_deploy_public_key: "{{ lookup('ansible.builtin.file', subsoil_deploy_public_key_file) }}"

  pre_tasks:
    - name: Validate the operator name and SSH public key
      ansible.builtin.assert:
        that:
          - subsoil_deploy_user is match('^[a-z_][a-z0-9_-]{0,30}$')
          - subsoil_deploy_user != 'root'
          - subsoil_deploy_public_key.splitlines() | length == 1
          - subsoil_deploy_public_key is match('^(ssh-|ecdsa-|sk-)\S+ +[A-Za-z0-9+/]+=*( |$)')
        fail_msg: Supply a non-root operator name and a single OpenSSH public key.

    - name: Check Debian release and install Ansible's Python prerequisites if missing
      ansible.builtin.raw: |
        set -eu
        . /etc/os-release
        if [ "$ID" != debian ] || [ "${VERSION_CODENAME:-}" != trixie ]; then
          echo "This playbook expects Debian 13 (Trixie)." >&2
          exit 1
        fi
        if ! /usr/bin/python3 -c 'import apt' 2>/dev/null; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt
          echo "Installed Ansible prerequisites."
        fi
      register: python_bootstrap
      changed_when: "'Installed Ansible prerequisites.' in python_bootstrap.stdout_lines"

  tasks:
    - name: Install host prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - git
          - sudo
        update_cache: true
        cache_valid_time: 3600

    - name: Create the deployment operator
      ansible.builtin.user:
        name: "{{ subsoil_deploy_user }}"
        shell: /bin/bash
        create_home: true
      register: subsoil_operator

    - name: Prepare the operator's SSH directory
      ansible.builtin.file:
        path: "{{ subsoil_operator.home }}/.ssh"
        state: directory
        owner: "{{ subsoil_deploy_user }}"
        mode: "0700"

    - name: Authorize the operator's SSH key
      ansible.builtin.lineinfile:
        path: "{{ subsoil_operator.home }}/.ssh/authorized_keys"
        line: "{{ subsoil_deploy_public_key }}"
        create: true
        owner: "{{ subsoil_deploy_user }}"
        mode: "0600"

    - name: Grant the operator sudo access for Ansible
      ansible.builtin.copy:
        dest: /etc/sudoers.d/subsoil-deploy
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: "{{ subsoil_deploy_user }} ALL=(root) NOPASSWD: ALL\n"

    - name: Create the repository key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Fetch Docker's repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      register: docker_key

    - name: Configure Docker's Debian repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: trixie
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
      register: docker_sources

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: "{{ docker_key.changed or docker_sources.changed }}"
        policy_rc_d: 101

    - name: Start Docker and enable it at boot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      tags: docker_daemon

    - name: Check the Docker daemon
      ansible.builtin.command: docker info
      changed_when: false
      tags: docker_daemon

    - name: Check Compose
      ansible.builtin.command: docker compose version
      changed_when: false
