---
- name: Remove the legacy hosted Subsoil deployment
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Require the hosted project name before deleting its data
      ansible.builtin.assert:
        that: subsoil_confirm_destroy | default('') == 'subsoil-hosted'
        fail_msg: Set subsoil_confirm_destroy=subsoil-hosted to remove the legacy deployment and its data.

    - name: Check for the old checkout
      ansible.builtin.stat:
        path: /root/subsoil
      register: legacy_path

    - name: List the hosted project's containers, networks, and volumes
      ansible.builtin.command:
        argv: "{{ ['docker', item, 'ls', '--quiet', '--filter', 'label=com.docker.compose.project=subsoil-hosted'] + (['--all'] if item == 'container' else []) }}"
      loop: [container, network, volume]
      register: hosted_resources
      check_mode: false
      changed_when: false

    - name: Identify containers launched from the old checkout
      ansible.builtin.command:
        argv:
          - docker
          - container
          - ls
          - --all
          - --quiet
          - --filter
          - label=com.docker.compose.project=subsoil-hosted
          - --filter
          - label=com.docker.compose.project.working_dir=/root/subsoil
      register: legacy_containers
      check_mode: false
      changed_when: false

    - name: Verify that the resources belong to the legacy deployment
      ansible.builtin.assert:
        that:
          - hosted_resources.results[0].stdout_lines | difference(legacy_containers.stdout_lines) | length == 0
          - >-
            legacy_path.stat.exists or legacy_containers.stdout_lines | length > 0
            or hosted_resources.results | map(attribute='stdout_lines') | flatten | length == 0
        fail_msg: The hosted resources could not be tied to the legacy checkout. Verify which deployment owns them before resetting.

    - name: Remove the old containers, then their networks and volumes
      ansible.builtin.command:
        argv: "{{ ['docker', item.0.item, 'rm'] + (['--force'] if item.0.item == 'container' else []) + [item.1] }}"
      loop: "{{ hosted_resources.results | subelements('stdout_lines') }}"
      loop_control:
        label: "{{ item.0.item }} {{ item.1 }}"

    - name: Remove the old checkout and generated credentials
      ansible.builtin.file:
        path: /root/subsoil
        state: absent
